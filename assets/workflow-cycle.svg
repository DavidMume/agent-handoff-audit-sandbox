<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" rx="24" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="999" height="499" rx="23.5" fill="none" stroke="#30363d"/>

  <!-- AUDIT branch box (top) -->
  <g transform="translate(650,70)">
    <rect x="-110" y="-32" width="220" height="64" rx="14" fill="#241a08" stroke="#f2cc60" stroke-width="2"/>
    <g transform="translate(-82,0)" stroke="#f2cc60" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-12,-14 L12,-14 L12,4 C12,14 0,20 0,20 C0,20 -12,14 -12,4 Z"/>
      <path d="M-5,0 L-1,6 L7,-6" />
    </g>
    <text x="16" y="-4" text-anchor="middle" font-size="15" font-weight="700" fill="#f2cc60">audit / final-audit</text>
    <text x="16" y="16" text-anchor="middle" font-size="12" fill="#8b949e">cross-check the other agent</text>
  </g>

  <!-- main row -->
  <!-- START -->
  <g transform="translate(110,260)">
    <rect x="-90" y="-40" width="180" height="80" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <g transform="translate(-58,0)" fill="#58a6ff">
      <polygon points="-8,-11 -8,11 10,0"/>
    </g>
    <text x="18" y="-4" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">start</text>
    <text x="18" y="16" text-anchor="middle" font-size="11" fill="#8b949e">read ledger, check locks</text>
  </g>

  <!-- WORK -->
  <g transform="translate(370,260)">
    <rect x="-90" y="-40" width="180" height="80" rx="16" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <g transform="translate(-58,0)" stroke="#8b949e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-8,10 L6,-4"/>
      <path d="M2,-10 L10,-2 L2,6 L-6,-2 Z"/>
    </g>
    <text x="18" y="-4" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">work</text>
    <text x="18" y="16" text-anchor="middle" font-size="11" fill="#8b949e">smallest correct change</text>
  </g>

  <!-- HANDOFF -->
  <g transform="translate(650,260)">
    <rect x="-100" y="-40" width="200" height="80" rx="16" fill="#161b22" stroke="#d97757" stroke-width="2"/>
    <g transform="translate(-64,0)" stroke="#d97757" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10,0 L10,0"/>
      <path d="M4,-6 L10,0 L4,6"/>
    </g>
    <text x="24" y="-4" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">handoff</text>
    <text x="24" y="16" text-anchor="middle" font-size="11" fill="#8b949e">append WORKLOG, close session</text>
  </g>

  <!-- TAKEOVER -->
  <g transform="translate(900,260)">
    <rect x="-90" y="-40" width="180" height="80" rx="16" fill="#161b22" stroke="#19c37d" stroke-width="2"/>
    <g transform="translate(-56,0)" stroke="#19c37d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8,-9 A9,9 0 1 0 9,0"/>
      <path d="M8,-13 L8,-5 L1,-6"/>
    </g>
    <text x="20" y="-4" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">takeover</text>
    <text x="20" y="16" text-anchor="middle" font-size="11" fill="#8b949e">next agent reviews first</text>
  </g>

  <!-- straight connectors -->
  <path d="M200,260 L280,260" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M460,260 L550,260" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M750,260 L810,260" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- handoff -> audit branch -->
  <path d="M650,220 L650,102" stroke="#f2cc60" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="668" y="165" font-size="11" fill="#f2cc60">at milestones</text>

  <!-- loop back: takeover -> work -->
  <path d="M900,300 C 900,410 370,410 370,300" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="635" y="430" text-anchor="middle" font-size="13" fill="#8b949e">next agent continues the task</text>
</svg>
