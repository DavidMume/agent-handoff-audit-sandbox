<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#30363d"/>

  <text x="600" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#e6edf3">🤝 Agent Handoff &amp; Audit</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#8b949e">One shared ledger. Two agents. Zero context loss.</text>

  <!-- Claude node -->
  <g transform="translate(220,215)">
    <circle r="58" fill="#2b1710" stroke="#d97757" stroke-width="2"/>
    <g stroke="#d97757" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-26" y="-28" width="52" height="46" rx="13"/>
      <line x1="0" y1="-28" x2="0" y2="-40"/>
      <circle cx="0" cy="-44" r="3.5" fill="#d97757" stroke="none"/>
      <circle cx="-11" cy="-6" r="4.5" fill="#d97757" stroke="none"/>
      <circle cx="11" cy="-6" r="4.5" fill="#d97757" stroke="none"/>
      <line x1="-11" y1="10" x2="11" y2="10"/>
    </g>
    <text x="0" y="90" text-anchor="middle" font-size="18" font-weight="600" fill="#e6edf3">Claude Code</text>
  </g>

  <!-- Ledger node -->
  <g transform="translate(600,215)">
    <rect x="-70" y="-62" width="140" height="124" rx="18" fill="#111820" stroke="#58a6ff" stroke-width="2"/>
    <path d="M-38,-34 L-10,-34 L-4,-26 L38,-26 L38,32 L-38,32 Z" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-24" y1="-10" x2="24" y2="-10" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
    <line x1="-24" y1="2" x2="24" y2="2" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
    <line x1="-24" y1="14" x2="6" y2="14" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#58a6ff">.agent-coordination/</text>
  </g>

  <!-- Codex node -->
  <g transform="translate(980,215)">
    <circle r="58" fill="#08201a" stroke="#19c37d" stroke-width="2"/>
    <g stroke="#19c37d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-26" y="-28" width="52" height="46" rx="13"/>
      <line x1="0" y1="-28" x2="0" y2="-40"/>
      <circle cx="0" cy="-44" r="3.5" fill="#19c37d" stroke="none"/>
      <circle cx="-11" cy="-6" r="4.5" fill="#19c37d" stroke="none"/>
      <circle cx="11" cy="-6" r="4.5" fill="#19c37d" stroke="none"/>
      <line x1="-11" y1="10" x2="11" y2="10"/>
    </g>
    <text x="0" y="90" text-anchor="middle" font-size="18" font-weight="600" fill="#e6edf3">Codex</text>
  </g>

  <!-- Arrows: Claude <-> ledger -->
  <path d="M282,196 C 400,170 440,170 466,190" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="374" y="168" text-anchor="middle" font-size="13" fill="#8b949e">write handoff</text>

  <path d="M466,242 C 440,262 400,262 282,236" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="374" y="282" text-anchor="middle" font-size="13" fill="#8b949e">read state</text>

  <!-- Arrows: ledger <-> Codex -->
  <path d="M734,190 C 760,170 800,170 918,196" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="826" y="168" text-anchor="middle" font-size="13" fill="#8b949e">read state</text>

  <path d="M918,236 C 800,262 760,262 734,242" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="826" y="282" text-anchor="middle" font-size="13" fill="#8b949e">write handoff</text>
</svg>
