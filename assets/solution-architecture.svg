<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="24" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="759" rx="23.5" fill="none" stroke="#30363d"/>

  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">Solution Architecture — agent-handoff-audit</text>

  <!-- Canonical install -->
  <g transform="translate(60,80)">
    <rect width="360" height="150" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#58a6ff">CANONICAL INSTALL (one copy)</text>
    <text x="16" y="48" font-size="14" font-family="ui-monospace,Menlo,monospace" fill="#e6edf3">~/.local/share/agent-handoff-audit/</text>
    <text x="30" y="70" font-size="12.5" fill="#8b949e">├─ SKILL.md</text>
    <text x="30" y="88" font-size="12.5" fill="#8b949e">├─ install.sh</text>
    <text x="30" y="106" font-size="12.5" fill="#8b949e">├─ scripts/init-project.sh</text>
    <text x="30" y="124" font-size="12.5" fill="#8b949e">├─ references/ (checklist, log formats)</text>
    <text x="30" y="142" font-size="12.5" fill="#8b949e">└─ templates/ (6 ledger templates)</text>
  </g>

  <!-- Symlink targets -->
  <g transform="translate(60,300)">
    <rect width="360" height="90" rx="14" fill="#0d1720" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">symlink</text>
    <text x="16" y="46" font-size="13" font-family="ui-monospace,Menlo,monospace" fill="#e6edf3">~/.claude/skills/agent-handoff-audit</text>
    <text x="16" y="70" font-size="11" fill="#8b949e">→ used by Claude Code runtime</text>
  </g>

  <g transform="translate(60,420)">
    <rect width="360" height="90" rx="14" fill="#0d1720" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">symlink</text>
    <text x="16" y="46" font-size="13" font-family="ui-monospace,Menlo,monospace" fill="#e6edf3">~/.agents/skills/agent-handoff-audit</text>
    <text x="16" y="70" font-size="11" fill="#8b949e">→ used by Codex runtime</text>
  </g>

  <path d="M240,230 C 240,260 240,270 240,300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrBlue)"/>
  <path d="M240,230 C 240,340 240,380 240,420" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- Agent runtimes -->
  <g transform="translate(60,545)">
    <circle cx="60" cy="60" r="55" fill="#2b1710" stroke="#d97757" stroke-width="2"/>
    <text x="60" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#d97757">Claude Code</text>
    <text x="60" y="130" text-anchor="middle" font-size="11" fill="#8b949e">/agent-handoff-audit start|handoff|…</text>
  </g>
  <g transform="translate(240,545)">
    <circle cx="60" cy="60" r="55" fill="#08201a" stroke="#19c37d" stroke-width="2"/>
    <text x="60" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#19c37d">Codex</text>
    <text x="60" y="130" text-anchor="middle" font-size="11" fill="#8b949e">$agent-handoff-audit start|handoff|…</text>
  </g>
  <path d="M180,390 L120,545" stroke="#d97757" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M240,510 L300,545" stroke="#19c37d" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- init-project.sh -->
  <g transform="translate(500,150)">
    <rect width="220" height="70" rx="14" fill="#1a1206" stroke="#f2cc60" stroke-width="1.8"/>
    <text x="110" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#f2cc60">scripts/init-project.sh</text>
    <text x="110" y="50" text-anchor="middle" font-size="11" fill="#8b949e">run once per repo, idempotent</text>
  </g>
  <path d="M420,155 L500,180" stroke="#f2cc60" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M180,600 C 350,600 420,420 500,205" stroke="#d97757" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <path d="M300,600 C 420,600 460,400 500,215" stroke="#19c37d" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- Target project repo -->
  <g transform="translate(500,270)">
    <rect width="640" height="440" rx="16" fill="#111820" stroke="#a371f7" stroke-width="1.8"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#a371f7">your-project/  (any git repo)</text>

    <text x="20" y="58" font-size="13" font-family="ui-monospace,Menlo,monospace" fill="#e6edf3">AGENTS.md</text>
    <text x="140" y="58" font-size="11" fill="#8b949e">← protocol pointer for Codex</text>
    <text x="20" y="80" font-size="13" font-family="ui-monospace,Menlo,monospace" fill="#e6edf3">CLAUDE.md</text>
    <text x="140" y="80" font-size="11" fill="#8b949e">← protocol pointer for Claude</text>
    <text x="20" y="102" font-size="13" font-family="ui-monospace,Menlo,monospace" fill="#e6edf3">.gitignore</text>
    <text x="140" y="102" font-size="11" fill="#8b949e">← ignores .agent-coordination/</text>

    <rect x="20" y="126" width="600" height="270" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="36" y="152" font-size="13" font-weight="700" font-family="ui-monospace,Menlo,monospace" fill="#58a6ff">.agent-coordination/</text>
    <text x="36" y="152" font-size="11" fill="#8b949e" text-anchor="start" dx="0"></text>
    <text x="640" y="152" font-size="11" fill="#8b949e" text-anchor="end">local only, gitignored</text>

    <g font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="#e6edf3">
      <text x="50" y="182">ACTIVE_SESSION.md</text>
      <text x="50" y="208">CURRENT_STATE.md</text>
      <text x="50" y="234">WORKLOG.md</text>
      <text x="50" y="260">DECISIONS.md</text>
      <text x="50" y="286">RISKS.md</text>
      <text x="50" y="312">FINAL_AUDIT.md</text>
    </g>
    <g font-size="11" fill="#8b949e">
      <text x="260" y="182">who's working now</text>
      <text x="260" y="208">replaceable snapshot</text>
      <text x="260" y="234">append-only handoffs</text>
      <text x="260" y="260">durable decisions</text>
      <text x="260" y="286">open risks / blockers</text>
      <text x="260" y="312">reciprocal audit sign-off</text>
    </g>

    <text x="20" y="424" font-size="11" fill="#8b949e">Claude and Codex never call each other directly — every read/write goes through this folder.</text>
  </g>
</svg>
